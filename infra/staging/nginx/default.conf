# Docker's internal DNS resolver (re-resolves on every request)
resolver 127.0.0.11 valid=10s;

# ==========================================
# Order Service
# ==========================================
server {
    listen 80;
    server_name order-svc.ephemeral-poc.run.place;

    # Certbot renewal validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # HTTPS redirection
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name order-svc.ephemeral-poc.run.place;

    # SSL config
    ssl_certificate /etc/letsencrypt/live/order-svc.ephemeral-poc.run.place/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/order-svc.ephemeral-poc.run.place/privkey.pem;

    # Security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        set $upstream_order http://order-service:3000;
        proxy_pass         $upstream_order;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

