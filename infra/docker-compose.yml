version: '3.8'

services:
  # ==========================================
  # Databases
  # ==========================================
  postgres-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"

  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"

  mongo-db:
    image: mongo:6-jammy
    ports:
      - "27017:27017"

  # ==========================================
  # Applications
  # ==========================================
  order-service:
    build:
      context: ../app/order-service
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../app/order-service/.env
    depends_on:
      - postgres-db

  inventory-service:
    build:
      context: ../app/inventory-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ../app/inventory-service/.env
    depends_on:
      - mysql-db

  notification-service:
    build:
      context: ../app/notification-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    env_file:
      - ../app/notification-service/.env
    depends_on:
      - mongo-db
