name: Cleanup Job

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: true
        type: number

jobs:
  cleanup-pr:
    runs-on: [self-hosted, preview]
    environment: preview
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Delete Docker Containers
        run: |
          for SERVICE in order-service inventory-service notification-service frontend; do
            CONTAINER_NAME="${SERVICE}-pr-${{ inputs.pr_number }}"
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
          done
          
      - name: Cleanup Databases
        run: |
          bash ./scripts/cleanup_pr.sh order-service ${{ inputs.pr_number }} || true
          bash ./scripts/cleanup_pr.sh inventory-service ${{ inputs.pr_number }} || true
          bash ./scripts/cleanup_pr.sh notification-service ${{ inputs.pr_number }} || true

      - name: Delete Infisical Environments
        run: |
          PR_ENV="pr-${{ inputs.pr_number }}"
          DOMAIN="${{ secrets.PREVIEW_DOMAIN }}"
          
          ACCESS_TOKEN=$(curl --silent --request POST \
            --url https://infisical.${DOMAIN}/api/v1/auth/universal-auth/login \
            --header "Content-Type: application/json" \
            --data '{
              "clientId": "${{ secrets.INFISICAL_CLIENT_ID }}",
              "clientSecret": "${{ secrets.INFISICAL_CLIENT_SECRET }}"
            }' | jq -r '.accessToken')
          
          curl --silent --request DELETE \
            --url https://infisical.${DOMAIN}/api/v1/workspace/${{ secrets.INFISICAL_PROJECT_ID }}/environments/$PR_ENV \
            --header "Authorization: Bearer $ACCESS_TOKEN" || true

      - name: Prune Unused Docker Images
        run: docker image prune -a -f
