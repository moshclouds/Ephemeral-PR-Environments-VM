name: Cleanup Job

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: true
        type: number

jobs:
  cleanup-pr:
    runs-on: [self-hosted, preview]
    environment: preview
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Delete Docker Containers
        run: |
          for SERVICE in order-service inventory-service notification-service frontend; do
            CONTAINER_NAME="${SERVICE}-pr-${{ inputs.pr_number }}"
            docker stop $CONTAINER_NAME || true
            docker rm $CONTAINER_NAME || true
          done
          
      - name: Cleanup Databases
        run: |
          bash ./scripts/cleanup_pr.sh order-service ${{ inputs.pr_number }} || true
          bash ./scripts/cleanup_pr.sh inventory-service ${{ inputs.pr_number }} || true
          bash ./scripts/cleanup_pr.sh notification-service ${{ inputs.pr_number }} || true

      - name: Delete Infisical Environments
        run: |
          PR_ENV="pr-${{ inputs.pr_number }}"
          DOMAIN="${{ secrets.PREVIEW_DOMAIN }}"
          INFISICAL_API_URL="https://infisical.${DOMAIN}"

          ACCESS_TOKEN=$(infisical login \
            --method=universal-auth \
            --client-id="${{ secrets.INFISICAL_CLIENT_ID }}" \
            --client-secret="${{ secrets.INFISICAL_CLIENT_SECRET }}" \
            --domain="$INFISICAL_API_URL" \
            --plain --silent)

          for PROJECT_ID in \
            "${{ secrets.INFISICAL_ORDER_PROJECT_ID }}" \
            "${{ secrets.INFISICAL_INVENTORY_PROJECT_ID }}" \
            "${{ secrets.INFISICAL_NOTIFICATION_PROJECT_ID }}" \
            "${{ secrets.INFISICAL_FRONTEND_PROJECT_ID }}"
          do
            echo "Cleaning Infisical project ${PROJECT_ID} env ${PR_ENV}"

            # 1) Delete webhooks scoped to this PR environment
            WEBHOOKS=$(curl --silent --request GET \
              --url "${INFISICAL_API_URL}/api/v1/webhooks?projectId=${PROJECT_ID}&environment=${PR_ENV}" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" || echo '{"webhooks":[]}')

            echo "$WEBHOOKS" | jq -r '.webhooks[]?.id // empty' | while read -r WH_ID; do
              [ -z "$WH_ID" ] && continue
              echo "Deleting webhook ${WH_ID}"
              curl --silent --request DELETE \
                --url "${INFISICAL_API_URL}/api/v1/webhooks/${WH_ID}" \
                --header "Authorization: Bearer ${ACCESS_TOKEN}" || true
            done

            # 2) Resolve environment UUID by slug, then delete by id (current Infisical API)
            ENV_ID=$(curl --silent --request GET \
              --url "${INFISICAL_API_URL}/api/v1/projects/${PROJECT_ID}/environments/slug/${PR_ENV}" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              | jq -r '.environment.id // empty')

            if [ -z "$ENV_ID" ] || [ "$ENV_ID" = "null" ]; then
              echo "Environment ${PR_ENV} not found in project ${PROJECT_ID} (already gone?)"
              continue
            fi

            echo "Deleting environment id=${ENV_ID}"
            curl --silent --show-error --request DELETE \
              --url "${INFISICAL_API_URL}/api/v1/projects/${PROJECT_ID}/environments/${ENV_ID}?hardDelete=true" \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" || true
          done

      - name: Prune Unused Docker Images
        run: docker image prune -a -f
