name: Comment Job

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: true
        type: number
      changed_services:
        description: "JSON array of changed services"
        required: true
        type: string

jobs:
  post-comment:
    if: ${{ inputs.changed_services != '[]' && inputs.changed_services != '' }}
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = ${{ inputs.pr_number }};
            const domain = '${{ secrets.PREVIEW_DOMAIN }}';
            const changedServices = ${{ inputs.changed_services }};
            const frontendChanged = changedServices.includes('frontend');
            
            let feUrl;
            if (frontendChanged) {
              feUrl = `https://frontend-pr-${prNum}.${domain}`;
            } else {
              feUrl = `https://frontend.staging.${domain}`;
            }
            
            let deployedServices = '';
            if (frontendChanged) {
              deployedServices += `- **Frontend:** [https://frontend-pr-${prNum}.${domain}](https://frontend-pr-${prNum}.${domain})\n`;
            }
            if (changedServices.includes('order-service')) {
              deployedServices += `- **Order Service:** [https://order-service-pr-${prNum}.${domain}](https://order-service-pr-${prNum}.${domain})\n`;
            }
            if (changedServices.includes('inventory-service')) {
              deployedServices += `- **Inventory Service:** [https://inventory-service-pr-${prNum}.${domain}](https://inventory-service-pr-${prNum}.${domain})\n`;
            }
            if (changedServices.includes('notification-service')) {
              deployedServices += `- **Notification Service:** [https://notification-service-pr-${prNum}.${domain}](https://notification-service-pr-${prNum}.${domain})\n`;
            }

            const body = `🚀 **Ephemeral PR Environment Deployed!**\n\n` +
                         `Test your changes instantly using this link:\n` +
                         `👉 [**Open Frontend PR Dashboard**](${feUrl})\n\n` +
                         `### Deployed Preview Services:\n` + deployedServices;
            
            github.rest.issues.createComment({
              issue_number: prNum,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
