name: Comment Job

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: true
        type: number
      changed_services:
        description: "JSON array of changed services"
        required: true
        type: string

jobs:
  post-comment:
    if: ${{ inputs.changed_services != '[]' && inputs.changed_services != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate Frontend Query Params
        id: params
        run: |
          PARAMS=""
          if echo '${{ inputs.changed_services }}' | grep -q '"order-service"'; then PARAMS="${PARAMS}order_pr=${{ inputs.pr_number }}&"; fi
          if echo '${{ inputs.changed_services }}' | grep -q '"inventory-service"'; then PARAMS="${PARAMS}inventory_pr=${{ inputs.pr_number }}&"; fi
          if echo '${{ inputs.changed_services }}' | grep -q '"notification-service"'; then PARAMS="${PARAMS}notification_pr=${{ inputs.pr_number }}&"; fi
          PARAMS=${PARAMS%&}
          echo "query=?$PARAMS" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNum = ${{ inputs.pr_number }};
            const suffix = '${{ secrets.CLOUD_RUN_URL_SUFFIX }}';
            const changedServices = ${{ inputs.changed_services }};
            const frontendChanged = changedServices.includes('frontend');
            
            let feUrl;
            if (frontendChanged) {
              feUrl = `https://frontend-pr-${prNum}${suffix}${{ steps.params.outputs.query }}`;
            } else {
              feUrl = `https://client-web-app.ephemeral-poc.run.place${{ steps.params.outputs.query }}`;
            }
            
            let deployedServices = '';
            if (frontendChanged) {
              deployedServices += `- **Frontend:** [https://frontend-pr-${prNum}${suffix}](https://frontend-pr-${prNum}${suffix})\n`;
            }
            if (changedServices.includes('order-service')) {
              deployedServices += `- **Order Service:** [https://order-service-pr-${prNum}${suffix}](https://order-service-pr-${prNum}${suffix})\n`;
            }
            if (changedServices.includes('inventory-service')) {
              deployedServices += `- **Inventory Service:** [https://inventory-service-pr-${prNum}${suffix}](https://inventory-service-pr-${prNum}${suffix})\n`;
            }
            if (changedServices.includes('notification-service')) {
              deployedServices += `- **Notification Service:** [https://notification-service-pr-${prNum}${suffix}](https://notification-service-pr-${prNum}${suffix})\n`;
            }

            const body = `🚀 **Ephemeral PR Environment Deployed!**\n\n` +
                         `Test your changes instantly using this link:\n` +
                         `👉 [**Open Frontend PR Dashboard**](${feUrl})\n\n` +
                         `### Deployed Cloud Run Services:\n` + deployedServices;
            
            github.rest.issues.createComment({
              issue_number: prNum,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })
