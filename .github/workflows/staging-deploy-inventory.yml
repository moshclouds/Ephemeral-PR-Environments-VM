name: Deploy Inventory Service

on:
  push:
    branches: [main]
    paths:
      - 'app/inventory-service/**'
      - '.github/workflows/staging-deploy-inventory.yml'

jobs:
  # JOB 1: Build & Push (Runs on GitHub Cloud Servers - FREE CPU/RAM)
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Auth
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build & Push Docker Image
        run: |
          IMAGE="${{ secrets.GCP_AR_REPO }}/inventory-service:staging"
          docker build -t $IMAGE ./app/inventory-service
          docker push $IMAGE

  # JOB 2: Deploy (Runs on Staging VM)
  deploy:
    needs: build-and-push
    runs-on: self-hosted
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Code to VM
        run: rsync -a --exclude='.git/' ./ ~/Ephemeral-PR-Environments/

      - name: Pull and Restart Container
        run: |
          cd ~/Ephemeral-PR-Environments/infra
          
          # Export the AR Repo URL so docker-compose can use it
          export GCP_AR_REPO="${{ secrets.GCP_AR_REPO }}"
          
          # Ensure VM Docker is authenticated to pull from AR
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          
          # Pull the new image and restart only inventory-service
          docker compose -f docker-compose.staging.yml pull inventory-service
          docker compose -f docker-compose.staging.yml up -d --no-deps inventory-service
          docker restart nginx-proxy
