name: Deploy Job

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: true
        type: number
      changed_services:
        description: "JSON array of changed services"
        required: true
        type: string

jobs:
  deploy-pr:
    runs-on: self-hosted
    strategy:
      matrix:
        service: ${{ fromJSON(inputs.changed_services) }}
    steps:
      - name: Deploy to Preview VM
        run: |
          IMAGE="${{ secrets.GCP_AR_REPO }}/${{ matrix.service }}:pr-${{ inputs.pr_number }}"
          SERVICE_NAME="${{ matrix.service }}-pr-${{ inputs.pr_number }}"
          PR_ENV="pr-${{ inputs.pr_number }}"
          DOMAIN="${{ secrets.PREVIEW_DOMAIN }}" # e.g. preview.yourdomain.com
          URL="${SERVICE_NAME}.${DOMAIN}"
          
          echo "Deploying $SERVICE_NAME to https://$URL"
          
          # 1. Create Infisical Environment (if it doesn't exist)
          infisical environments create --name $PR_ENV --slug $PR_ENV --projectId ${{ secrets.INFISICAL_PROJECT_ID }} || true
          
          # 2. Inject Dynamic DB URL if backend
          if [ "${{ matrix.service }}" == "order-service" ]; then
            infisical secrets set DATABASE_URL="postgresql://postgres:postgres@preview-postgres:5432/order_db_${PR_ENV}" --env $PR_ENV --projectId ${{ secrets.INFISICAL_PROJECT_ID }}
          elif [ "${{ matrix.service }}" == "inventory-service" ]; then
            infisical secrets set DATABASE_URL="mysql://root:mysqlroot@preview-mysql:3306/inventory_db_${PR_ENV}" --env $PR_ENV --projectId ${{ secrets.INFISICAL_PROJECT_ID }}
          elif [ "${{ matrix.service }}" == "notification-service" ]; then
            infisical secrets set DATABASE_URL="mongodb://preview-mongo:27017/notification_db_${PR_ENV}?replicaSet=rs0&directConnection=true" --env $PR_ENV --projectId ${{ secrets.INFISICAL_PROJECT_ID }}
          fi
          
          # 3. Register Webhook (Using the API)
          curl --silent --request POST \
            --url https://infisical.${DOMAIN}/api/v1/webhooks \
            --header "Authorization: Bearer ${{ secrets.INFISICAL_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{
              "workspaceId": "${{ secrets.INFISICAL_PROJECT_ID }}",
              "environment": "'$PR_ENV'",
              "secretPath": "/",
              "webhookUrl": "https://webhook.'$DOMAIN'/hooks/infisical?app=${{ matrix.service }}",
              "webhookSecretKey": "${{ secrets.WEBHOOK_SECRET }}"
          }' || true

          # 4. Remove old container if exists
          docker stop $SERVICE_NAME || true
          docker rm $SERVICE_NAME || true
          
          # 5. Run Docker Container using Infisical CLI for secrets, attached to preview-net
          infisical run --projectId ${{ secrets.INFISICAL_PROJECT_ID }} --env $PR_ENV -- \
          docker run -d \
            --name $SERVICE_NAME \
            --network preview-net \
            --label "traefik.enable=true" \
            --label "traefik.http.routers.${SERVICE_NAME}.rule=Host('${URL}')" \
            --label "traefik.http.routers.${SERVICE_NAME}.tls.certresolver=myresolver" \
            $IMAGE
