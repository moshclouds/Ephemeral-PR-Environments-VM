name: Deploy Job

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull Request Number"
        required: true
        type: number
      changed_services:
        description: "JSON array of changed services"
        required: true
        type: string

jobs:
  deploy-pr:
    runs-on: [self-hosted, preview]
    environment: preview
    strategy:
      matrix:
        service: ${{ fromJSON(inputs.changed_services) }}
  
    steps:
      - name: Deploy to Preview VM
        run: |
          IMAGE="${{ secrets.GCP_AR_REPO }}/${{ matrix.service }}:pr-${{ inputs.pr_number }}"
          SERVICE_NAME="${{ matrix.service }}-pr-${{ inputs.pr_number }}"
          PR_ENV="pr-${{ inputs.pr_number }}"
          DOMAIN="${{ secrets.PREVIEW_DOMAIN }}"
          URL="${SERVICE_NAME}.${DOMAIN}"
          
          echo "Deploying $SERVICE_NAME to https://$URL"
          
          # 1. Login via API
          export INFISICAL_TOKEN=$(curl --silent --request POST \
            --url https://infisical.${DOMAIN}/api/v1/auth/universal-auth/login \
            --header "Content-Type: application/json" \
            --data '{
              "clientId": "${{ secrets.INFISICAL_CLIENT_ID }}",
              "clientSecret": "${{ secrets.INFISICAL_CLIENT_SECRET }}"
            }' | jq -r '.accessToken')
            
          if [ -z "$INFISICAL_TOKEN" ] || [ "$INFISICAL_TOKEN" == "null" ]; then
            echo "Failed to authenticate with Infisical API."
            exit 1
          fi
          
          # 2. Create Environment via API
          curl --silent --request POST \
            --url https://infisical.${DOMAIN}/api/v1/workspace/${{ secrets.INFISICAL_PROJECT_ID }}/environments \
            --header "Authorization: Bearer $INFISICAL_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{
              "name": "'$PR_ENV'",
              "slug": "'$PR_ENV'"
            }' || true
          
          # 3. Inject Dynamic DB URL using CLI (which will pick up the exported INFISICAL_TOKEN automatically)
          if [ "${{ matrix.service }}" == "order-service" ]; then
            infisical secrets set DATABASE_URL="postgresql://postgres:postgres@preview-postgres:5432/order_db_${PR_ENV}" --env $PR_ENV --projectId ${{ secrets.INFISICAL_PROJECT_ID }} --domain https://infisical.${DOMAIN}
          elif [ "${{ matrix.service }}" == "inventory-service" ]; then
            infisical secrets set DATABASE_URL="mysql://root:mysqlroot@preview-mysql:3306/inventory_db_${PR_ENV}" --env $PR_ENV --projectId ${{ secrets.INFISICAL_PROJECT_ID }} --domain https://infisical.${DOMAIN}
          elif [ "${{ matrix.service }}" == "notification-service" ]; then
            infisical secrets set DATABASE_URL="mongodb://preview-mongo:27017/notification_db_${PR_ENV}?replicaSet=rs0&directConnection=true" --env $PR_ENV --projectId ${{ secrets.INFISICAL_PROJECT_ID }} --domain https://infisical.${DOMAIN}
          fi
          
          # 4. Register Webhook
          curl --silent --request POST \
            --url https://infisical.${DOMAIN}/api/v1/webhooks \
            --header "Authorization: Bearer $INFISICAL_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{
              "workspaceId": "${{ secrets.INFISICAL_PROJECT_ID }}",
              "environment": "'$PR_ENV'",
              "secretPath": "/",
              "webhookUrl": "https://webhook.'$DOMAIN'/hooks/infisical?app=${{ matrix.service }}",
              "webhookSecretKey": "${{ secrets.WEBHOOK_SECRET }}"
          }' || true

          # 5. Remove old container if exists
          docker stop $SERVICE_NAME || true
          docker rm $SERVICE_NAME || true
          
          # 6. Run Docker Container using Infisical CLI for secrets, attached to preview-net
          infisical run --projectId ${{ secrets.INFISICAL_PROJECT_ID }} --env $PR_ENV --domain https://infisical.${DOMAIN} -- \
          docker run -d \
            --name $SERVICE_NAME \
            --network preview_preview-net \
            --label "traefik.enable=true" \
            --label "traefik.http.routers.${SERVICE_NAME}.rule=Host(\`${URL}\`)" \
            --label "traefik.http.routers.${SERVICE_NAME}.tls.certresolver=myresolver" \
            $IMAGE
